<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Coverflow Slider</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    body {
      background-color: #f7f9f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    /* Контейнер слайдера */
    .swiper {
      width: 100%;
      padding-top: 50px;
      padding-bottom: 50px;
    }

    /* Карточка слайда */
    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 280px;
      height: 380px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      transition: filter 0.3s ease;
    }

    /* Добавляем размытие для боковых слайдов, как в видео */
    .swiper-slide:not(.swiper-slide-active) {
      filter: blur(2px) grayscale(20%);
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="10.jfif" alt="Фото 7" /></div>
      <div class="swiper-slide"><img src="125.jfif" alt="Фото 7" /></div>
      <div class="swiper-slide"><img src="01.jpeg" alt="Фото 1" /></div>
      <div class="swiper-slide"><img src="06.jpeg" alt="Фото 6" /></div>
      <div class="swiper-slide"><img src="07.jpeg" alt="Фото 7" /></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const swiper = new Swiper('.mySwiper', {
      effect: 'coverflow',
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: 'auto',
      loop: true,
      coverflowEffect: {
        rotate: 0,        /* Угол поворота слайдов */
        stretch: 80,      /* Расстояние/наложение слайдов друг на друга */
        depth: 200,       /* Эффект глубины (удаление боковых слайдов) */
        modifier: 1,      /* Множитель эффекта */
        slideShadows: false, /* Тень Swiper (отключена для мягкого вида) */
      },
    });
  </script>
</body>
</html>
